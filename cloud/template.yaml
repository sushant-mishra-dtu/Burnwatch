AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BurnWatch frame storage, verification, event log and email alerts.

Parameters:
  AlertEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: Confirm the SNS subscription sent to this email address.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-haiku-5-5
    AllowedPattern: '^anthropic\.[a-zA-Z0-9.:-]+$'
    Description: Claude model on the Bedrock Mantle endpoint in this region (primary verifier).
  NvidiaApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Fallback verifier key. Pass with --parameter-overrides; never save it in samconfig.toml. Empty skips Nemotron.
  NvidiaModelId:
    Type: String
    Default: ''
    Description: Nemotron vision model ID confirmed by cloud/nim_probe.py. Empty skips Nemotron.
  NimBaseUrl:
    Type: String
    Default: https://integrate.api.nvidia.com/v1
    AllowedPattern: '^https://[^\s]+$'
  ConfidenceThreshold:
    Type: Number
    Default: 0.6
    MinValue: 0
    MaxValue: 1
  IotEndpoint:
    Type: String
    AllowedPattern: '^[a-z0-9-]+-ats\.iot\.ap-south-1\.amazonaws\.com$'
    Description: Hostname from describe_endpoint(endpointType='iot:Data-ATS').

Resources:
  FramesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Repeat this name in the Lambda policy/env to avoid an S3 dependency cycle.
      BucketName: !Sub 'burnwatch-frames-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireFrames
            Status: Enabled
            Prefix: frames/
            ExpirationInDays: 7

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: burnwatch-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: camera
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: camera
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: burnwatch-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      # SAM resolves CodeUri relative to cloud/template.yaml, hence verify/.
      CodeUri: verify/
      Handler: app.lambda_handler
      Runtime: python3.13
      # Worst case: Claude, then Nemotron, then Rekognition.
      Timeout: 90
      MemorySize: 512
      Environment:
        Variables:
          TABLE: !Ref EventsTable
          TOPIC_ARN: !Ref AlertsTopic
          BEDROCK_REGION: !Ref AWS::Region
          MODEL_ID: !Ref BedrockModelId
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          NVIDIA_MODEL_ID: !Ref NvidiaModelId
          NIM_BASE_URL: !Ref NimBaseUrl
          CONF_THRESHOLD: !Ref ConfidenceThreshold
          IOT_ENDPOINT: !Ref IotEndpoint
          BUCKET: !Sub 'burnwatch-frames-${AWS::AccountId}-${AWS::Region}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadFrames
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::burnwatch-frames-${AWS::AccountId}-${AWS::Region}/frames/*'
            - Sid: WriteEvents
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt EventsTable.Arn
            - Sid: SendAlerts
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertsTopic
            - Sid: PublishVerdicts
              Effect: Allow
              Action: iot:Publish
              Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/burnwatch/*/verdict'
            - Sid: FallbackImageLabels
              Effect: Allow
              Action: rekognition:DetectLabels
              Resource: '*'
            - Sid: InvokeClaudeOnMantle
              Effect: Allow
              # AnthropicBedrockMantle -> bedrock-mantle.<region>.api.aws/anthropic/v1/messages.
              # Resource-level ARN format for this action is not yet verified, hence '*'.
              Action: bedrock-mantle:CreateInference
              Resource: '*'
      Events:
        FrameCreated:
          Type: S3
          Properties:
            Bucket: !Ref FramesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: frames/
                  - Name: suffix
                    Value: .jpg

Outputs:
  BucketName:
    Value: !Ref FramesBucket
  TableName:
    Value: !Ref EventsTable
  TopicArn:
    Value: !Ref AlertsTopic
  VerifyFunctionName:
    Value: !Ref VerifyFunction
